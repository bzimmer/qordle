name: build

on:
  push

permissions:
  contents: read

jobs:

  build:
    uses: bzimmer/actions/.github/workflows/build.yaml@main
    with:
      skipBuild: false
      skipCoverage: false
    secrets: inherit

  vuln:
    uses: bzimmer/actions/.github/workflows/vuln.yaml@main

  regression:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: install go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: install task
        uses: arduino/setup-task@v1

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install fd-find zsh jq

          mkdir -p "${HOME}/.local/bin"
          ln -s "$(which fdfind)" "${HOME}/.local/bin/fd"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      # Plays only: the duckdb analysis is reporting, read locally, and
      # can't fail the build.
      - name: run regression
        run: task regression:run -- 20
